## Mod Properties
# NOTE: keep every value ASCII-only. Gradle reads gradle.properties with ISO-8859-1,
# so non-ASCII text here would be mangled before it ever reaches mods.toml.
# Chinese display strings live in assets/rew/lang/zh_cn.json instead.
mod_id=rew
mod_name=Recipe Editor Workshop
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.rew
mod_authors=OSHANG
mod_description=Visual GTCEu recipe editor for modpack authors: browse, create, modify, disable and export recipes as KubeJS.

## Dependency Versions
# ldlib_version 必须与「整合包 mods/ 下实际装的那份」对齐，而不是与 gtceu 内嵌的那份。
# gtceu jarjar 里嵌的是 1.0.40.b，但 mods/ 下的独立 ldlib jar 会覆盖它；
# 测试环境实装 1.0.50，所以编译基线取 1.0.50 —— 否则用到新版 API 时会
# 编译通过、运行时 NoSuchMethodError。
gtceu_version=7.5.3
ldlib_version=1.0.50
registrate_version=MC1.20-1.3.11
# Configuration 配置库：走 Modrinth 公开 maven，按「版本 ID」精确取 Forge 1.20.1 那份。
# h7CBg2Oe = Configuration 3.1.0 (Forge 1.20.1)
configuration_version=3.1.0
configuration_version_id=h7CBg2Oe
